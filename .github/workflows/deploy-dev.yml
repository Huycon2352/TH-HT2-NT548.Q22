name: Deploy Infrastructure - Dev

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Dev Infrastructure
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: TH-1/terraform/environments/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: terraform-dev-deploy
          aws-region: ap-southeast-1

      - name: Terraform Init
        id: init
        run: terraform init -backend-config=../../backend-config/dev.hcl.example

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        if: success()
        run: terraform output

      - name: Status
        run: echo "✅ Infrastructure deployed successfully"
