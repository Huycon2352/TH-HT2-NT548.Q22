name: Deploy Infrastructure - Dev

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Dev Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TH-2/terraform/environments/dev

    env:
      TF_VAR_key_name: ${{ vars.TF_VAR_key_name }}
      TF_VAR_ssh_source_cidr: ${{ vars.TF_VAR_ssh_source_cidr }}
      TF_VAR_public_key: ${{ secrets.TF_VAR_public_key }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Generate Backend Config
        run: |
          cat > backend.hcl << EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "dev/terraform.tfstate"
          region         = "ap-southeast-1"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl 

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply tfplan 

      - name: Terraform Outputs
        if: success()
        run: terraform output

      - name: Status
        run: echo "✅ Infrastructure deployed successfully"
