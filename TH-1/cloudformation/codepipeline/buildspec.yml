version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12

    commands:
      - pip install cfn-lint
      - pip install taskcat

  build:
    commands:
      - echo "Running CloudFormation lint..."

      - cfn-lint main.yaml
      - cfn-lint templates/*.yaml

      - echo "Running TaskCat tests..."

      - taskcat test run

artifacts:
  files:
    - '**/*'
